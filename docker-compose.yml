services:
  db:
    image: mariadb:10.11
    container_name: poke-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: poke123
      MARIADB_DATABASE: pokenight
    volumes:
      - dbdata:/var/lib/mysql
      # Importado automaticamente APENAS na primeira subida, quando o
      # volume dbdata ainda esta vazio.
      - ./Myst/Servidor/pokenight.sql:/docker-entrypoint-initdb.d/01-pokenight.sql:ro
    ports:
      # Exposto no host pra voce abrir no HeidiSQL/DBeaver se quiser.
      - "3307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  server:
    build: ./docker
    container_name: poke-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
    volumes:
      - ./Myst/Servidor:/srv
      # Sobrepoe so o config.lua, sem tocar no arquivo original do repo.
      - ./docker/config.local.lua:/srv/config.lua:ro
      # Montado (em vez de embutido na imagem) porque o BuildKit nao
      # consegue ler o contexto de build dentro do OneDrive. Assim editar
      # o entrypoint.sh vale na proxima subida, sem rebuild.
      - ./docker/entrypoint.sh:/entrypoint.sh:ro
    ports:
      - "7183:7183"   # login / status
      - "7172:7172"   # game
    stdin_open: true
    tty: true

  # API que o cliente consome para criar conta e personagem.
  # Fica no mesmo network do db, entao conversa com ele por hostname.
  web:
    image: php:8.2-apache
    container_name: pko-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: pokenight
      DB_USER: root
      DB_PASS: poke123
    volumes:
      - ./api:/var/www/html
    ports:
      - "8088:80"
    command: >
      bash -c "docker-php-ext-install pdo_mysql > /dev/null 2>&1 &&
               apache2-foreground"

volumes:
  dbdata:
